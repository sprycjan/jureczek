<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 88" width="72" height="88">
  <defs>
    <!-- Soft shadow matching elevation specification -->
    <filter id="pin-shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.2" />
    </filter>
    <linearGradient id="pin-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5EBA8B" />
      <stop offset="100%" stop-color="#408E64" />
    </linearGradient>
    <linearGradient id="pin-stroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7BE2AF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2D6346" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="pin-inner-shadow" cx="50%" cy="38%" r="42%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" flood-opacity="0.22" stop-opacity="0.22" />
    </radialGradient>
  </defs>

  <g filter="url(#pin-shadow)">
    <!-- Pin Body: standard teardrop geometry scaled from 36x44dp (R=18, Tip at bottom) -->
    <!-- Center of head at (36, 26), tip at (36, 76) with smooth tangent curves and rounded tip -->
    <path d="M 36,4
             C 49.25,4 60,14.75 60,28
             C 60,37.8 53.4,49.2 42.2,65.6
             C 39.4,69.7 37.8,72 36,74.5
             C 34.2,72 32.6,69.7 29.8,65.6
             C 18.6,49.2 12,37.8 12,28
             C 12,14.75 22.75,4 36,4 Z"
          fill="url(#pin-gradient)"
          stroke="url(#pin-stroke)"
          stroke-width="1.75"
          stroke-linejoin="round" />

    <!-- Subtle ambient lighting overlay -->
    <path d="M 36,4
             C 49.25,4 60,14.75 60,28
             C 60,37.8 53.4,49.2 42.2,65.6
             C 39.4,69.7 37.8,72 36,74.5
             C 34.2,72 32.6,69.7 29.8,65.6
             C 18.6,49.2 12,37.8 12,28
             C 12,14.75 22.75,4 36,4 Z"
          fill="url(#pin-inner-shadow)" />

    <!-- Clean, neutral circular disc core (no symbol, clean empty marker) -->
    <!-- Crisp white circular well with subtle inset depth -->
    <circle cx="36" cy="27" r="13" fill="#FFFFFF" opacity="0.96" />
    <!-- Subtle inset ring for depth -->
    <circle cx="36" cy="27" r="13" fill="none" stroke="#000000" stroke-opacity="0.08" stroke-width="1" />
    
    <!-- Small subtle center point / dot indicating coordinate accuracy -->
    <circle cx="36" cy="27" r="3.2" fill="#52A378" opacity="0.9" />
  </g>
</svg>