</button>

<script>
  function updatePreviewName(val) {
    const el = document.getElementById('previewTitle');
    el.textContent = val.trim().length > 0 ? val : 'Nowa trasa kamperowa';
  }

  function updatePreviewDesc(val) {
    const el = document.getElementById('previewDesc');
    el.textContent = val.trim().length > 0 ? val : 'Dzikie postoje, bezpłatne parcele i punkty z wodą...';
  }

  function selectIcon(iconName, btn) {
    const previewSymbol = document.getElementById('previewIconSymbol');
    previewSymbol.textContent = iconName;

    document.querySelectorAll('.icon-btn').forEach(b => {
      b.classList.remove('bg-surface-container-high', 'text-primary', 'shadow-sm');
      b.classList.add('bg-surface-container-lowest', 'text-on-surface-variant');
    });
    btn.classList.add('bg-surface-container-high', 'text-primary', 'shadow-sm');
    btn.classList.remove('bg-surface-container-lowest', 'text-on-surface-variant');
  }

  function selectAccent(colorKey, btn) {
    const previewWrap = document.getElementById('previewIconWrap');
    
    // Clear icons checkmark
    document.querySelectorAll('.color-btn span').forEach(s => s.classList.add('hidden'));
    const innerCheck = btn.querySelector('span');
    if (innerCheck) innerCheck.classList.remove('hidden');

    // Update preview color class
    previewWrap.className = 'w-12 h-12 rounded-xl flex items-center justify-center shrink-0 shadow-md transition-colors duration-200';
    
    if (colorKey === 'emerald') {
      previewWrap.classList.add('bg-primary-container', 'text-on-primary-container');
    } else if (colorKey === 'amber') {
      previewWrap.classList.add('bg-secondary-container', 'text-on-secondary-container');
    } else if (colorKey === 'tertiary') {
      previewWrap.classList.add('bg-tertiary-container', 'text-on-tertiary');
    } else if (colorKey === 'orange') {
      previewWrap.classList.add('bg-secondary-fixed-dim', 'text-on-secondary-fixed');
    } else if (colorKey === 'purple') {
      previewWrap.classList.add('bg-tertiary-fixed-variant', 'text-on-tertiary-fixed');
    }
  }

  function setCover(type) {
    const previewCover = document.getElementById('previewCover');
    const btnMountain = document.getElementById('coverBtnMountain');
    const btnVan = document.getElementById('coverBtnVan');

    if (type === 'mountain') {
      btnMountain.classList.replace('bg-surface-container-lowest/50', 'bg-surface-container-lowest/80');
      btnMountain.classList.replace('text-on-surface-variant', 'text-primary');
      btnVan.classList.replace('bg-surface-container-lowest/80', 'bg-surface-container-lowest/50');
      btnVan.classList.replace('text-primary', 'text-on-surface-variant');
      previewCover.setAttribute('data-alt', 'Nocturnal landscape of rugged Alpine peaks under a starlit night sky with a waxing crescent moon, a winding mountain road leading past dense evergreen pine trees and a serene glacial lake reflecting starlight, illustrated in European bande dessinee comic style with atmospheric deep slate-green and dark teal shadows.');
    } else {
      btnVan.classList.replace('bg-surface-container-lowest/50', 'bg-surface-container-lowest/80');
      btnVan.classList.replace('text-on-surface-variant', 'text-primary');
      btnMountain.classList.replace('bg-surface-container-lowest/80', 'bg-surface-container-lowest/50');
      btnMountain.classList.replace('text-primary', 'text-on-surface-variant');
      previewCover.setAttribute('data-alt', 'Stylized vintage off-grid camper bus parked along a pine forest track under the starry Milky Way sky, retro European adventure comic illustration, roof rack with gear and warm glow from cabin curtains, muted forest green, sage emerald, and lantern amber highlights.');
    }
  }

  function toggleTag(btn) {
    const isSelected = btn.classList.contains('active');
    if (isSelected) {
      btn.classList.remove('active', 'bg-surface-container-high', 'text-primary');
      btn.classList.add('bg-surface-container-low', 'text-on-surface-variant');
      const icon = btn.querySelector('.material-symbols-outlined');
      if (icon) icon.style.fontVariationSettings = "'FILL' 0";
    } else {
      btn.classList.add('active', 'bg-surface-container-high', 'text-primary');
      btn.classList.remove('bg-surface-container-low', 'text-on-surface-variant');
      const icon = btn.querySelector('.material-symbols-outlined');
      if (icon) icon.style.fontVariationSettings = "'FILL' 1";
    }
  }

  function toggleSwitch(btn, isOffline) {
    const pin = btn.querySelector('span');
    const crewBox = document.getElementById('crewMembersBox');

    if (btn.classList.contains('bg-primary')) {
      btn.classList.replace('bg-primary', 'bg-surface-container-highest');
      pin.classList.replace('bg-on-primary', 'bg-outline');
      pin.classList.remove('translate-x-5');
      if (!isOffline && crewBox) crewBox.classList.add('hidden');
    } else {
      btn.classList.replace('bg-surface-container-highest', 'bg-primary');
      pin.classList.replace('bg-outline', 'bg-on-primary');
      pin.classList.add('translate-x-5');
      if (!isOffline && crewBox) crewBox.classList.remove('hidden');
    }
  }

  function triggerSuccessAction() {
    const btn = event.currentTarget;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[22px]">progress_activity</span><span>Tworzenie wyprawy...</span>';
    setTimeout(() => {
      btn.innerHTML = '<span class="material-symbols-outlined text-[22px]">check_circle</span><span>Utworzono pomyślnie!</span>';
      btn.classList.replace('bg-primary-container', 'bg-primary');
      btn.classList.replace('text-on-primary-container', 'text-on-primary');
    }, 600);
  }
</script></main><div class="fixed bottom-0 w-full z-50 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-4px_16px_rgba(0,0,0,0.4)]"><div class="h-20 px-gutter flex items-center justify-between gap-space-md"><button class="flex-1 h-12 rounded-lg bg-surface-container hover:bg-surface-container-high text-on-surface font-label-lg text-label-lg transition-colors flex items-center justify-center" onclick="history.back()" type="button">Anuluj</button><button class="flex-1 h-12 rounded-lg bg-primary-container hover:bg-primary text-on-primary-container font-label-lg text-label-lg shadow-[0_8px_24px_-4px_rgba(82,163,120,0.28)] transition-all flex items-center justify-center gap-space-xs" type="button"><span class="material-symbols-outlined text-[18px]">add_circle</span><span class="">Utwórz</span></button></div></div>
